<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/fonts.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/colors.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/dark.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/typography.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/spacing.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/elevation.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/tokens/icons.css">
<link rel="stylesheet" href="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/styles.css">
<script src="_ds/lumana-lumix-cloud-design-system-git-1b2e75e8-6731-4899-a6b5-0c0f64d44f4b/_ds_bundle.js"></script>
<style>html,body{height:100%;margin:0}</style>
</helmet>
<div class="dark-theme" style="position:relative;height:100%;min-height:560px;overflow:hidden;font-family:var(--font-sans);background:var(--color-elevation-surface-subtlest);color:var(--color-text-default)">
<aside ref="{{ drawerRef }}" style="position:absolute;top:0;right:0;bottom:0;z-index:10;width:{{ drawerW }}px;max-width:calc(100% - 120px);display:flex;flex-direction:column;background:var(--color-elevation-surface-default);border-left:1px solid var(--color-border-default);box-shadow:var(--shadow-md)">
<div title="Close" onClick="{{ onClose }}" style="position:absolute;top:8px;left:-44px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--color-secondary-gray-600);color:var(--color-primary-white);transition:opacity .3s" style-hover="opacity:.85"><span class="ui-icon-close" style="font-size:16px"></span></div>
<div title="Drag to resize" onMouseDown="{{ startResize }}" style="position:absolute;top:50%;left:-35px;width:14px;height:40px;margin-top:-20px;box-sizing:border-box;border-radius:7px;background:var(--color-secondary-gray-600);display:flex;align-items:center;justify-content:center;gap:2px;cursor:col-resize;z-index:1;transition:opacity .3s" style-hover="opacity:.85">
<div style="width:2px;height:16px;border-radius:1px;background:var(--color-primary-white)"></div>
<div style="width:2px;height:16px;border-radius:1px;background:var(--color-primary-white)"></div>
</div>
<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;height:49px;padding:0 24px;border-bottom:1px solid var(--color-border-default)">
<span style="font-size:16px;line-height:24px;font-weight:500">{{ title }}</span>
</div>
<sc-if value="{{ hasTabs }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;gap:24px;flex-shrink:0;padding:0 24px;border-bottom:1px solid var(--color-border-default)">
<sc-for list="{{ tabItems }}" as="tb" hint-placeholder-count="2">
<div onClick="{{ tb.onClick }}" style="display:flex;align-items:center;height:44px;cursor:pointer;font-size:14px;line-height:24px;font-weight:500;color:{{ tb.color }};box-shadow:{{ tb.shadow }};transition:color .3s">{{ tb.label }}</div>
</sc-for>
</div>
</sc-if>
<div style="flex:1;min-height:0;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:8px">
<div style="font-size:12px;line-height:20px;font-weight:500;color:var(--color-text-subtle)">Field label</div>
<x-import component-from-global-scope="LumanaDesignSystem_1b2e75.Select" placeholder="Select an option" options="{{ opts }}" hint-size="100%,40px" style="width:100%"></x-import>
</div>
</div>
<div style="display:flex;justify-content:flex-end;gap:8px;flex-shrink:0;padding:16px 24px;border-top:1px solid var(--color-border-default)">
<x-import component-from-global-scope="LumanaDesignSystem_1b2e75.Button" text="Cancel" type="default" size="m" onClick="{{ onClose }}" hint-size="80px,40px"></x-import>
<x-import component-from-global-scope="LumanaDesignSystem_1b2e75.Button" text="Save" type="primary" size="m" hint-size="80px,40px"></x-import>
</div>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:620},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Drawer title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tabs&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Details, Access level&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:560,&quot;min&quot;:400,&quot;max&quot;:1200,&quot;tsType&quot;:&quot;number&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { drawerW: null, tab: 0 };
  drawerRef = React.createRef();
  startResize(e) {
    e.preventDefault();
    const el = this.drawerRef.current; if (!el) return;
    const right = el.getBoundingClientRect().right, max = (el.parentElement?.getBoundingClientRect().width || 1200) - 120;
    const move = ev => this.setState({ drawerW: Math.max(400, Math.min(max, right - ev.clientX)) });
    this.endResize = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', this.endResize); document.body.style.cursor = ''; document.body.style.userSelect = ''; this.endResize = null; };
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    window.addEventListener('mousemove', move); window.addEventListener('mouseup', this.endResize);
  }
  componentDidMount() {
    this.onKey = e => { if (e.key === 'Escape' && this.props.onClose) this.props.onClose(); };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); this.endResize && this.endResize(); }
  renderVals() {
    const tabs = (this.props.tabs ?? 'Details, Access level').split(',').map(t => t.trim()).filter(Boolean);
    return {
      title: this.props.title ?? 'Drawer title',
      drawerW: this.state.drawerW ?? this.props.width ?? 560,
      drawerRef: this.drawerRef, startResize: e => this.startResize(e),
      onClose: () => this.props.onClose && this.props.onClose(),
      hasTabs: tabs.length > 0,
      tabItems: tabs.map((label, i) => ({ label, onClick: () => this.setState({ tab: i }),
        color: this.state.tab === i ? 'var(--color-icon-primary-default)' : 'var(--color-text-default)',
        shadow: this.state.tab === i ? 'inset 0 -3px 0 var(--color-border-selected-default)' : 'none' })),
      opts: [{ value: 'a', label: 'Option A' }, { value: 'b', label: 'Option B' }],
    };
  }
}
</script>
</body>
</html>
